<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <linearGradient id="onbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF5C1A"/>
      <stop offset="100%" stop-color="#F2A93B"/>
    </linearGradient>
  </defs>

  <rect width="393" height="852" fill="url(#onbGrad)"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Brand Hero Center -->
  <g transform="translate(196.5, 170)">
    <!-- Hearth Glow -->
    <circle cx="0" cy="0" r="54" fill="#26221E" stroke="#332D27" stroke-width="2"/>
    <!-- Flame & Crossed Peel/Fork Glyph -->
    <path d="M0 -28 C-8 -15 -10 -4 -5 5 C-3 8 0 10 0 10 C0 10 3 8 5 5 C10 -4 8 -15 0 -28 Z" fill="url(#flameGrad)"/>
    <circle cx="0" cy="2" r="3" fill="#FFF275"/>
    <circle cx="-14" cy="-8" r="1.5" fill="#FF5C1A"/>
    <circle cx="16" cy="-6" r="2" fill="#F2A93B"/>
  </g>

  <!-- Typography Lockup -->
  <text x="196.5" y="260" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">CRUST <tspan fill="url(#flameGrad)">&amp;</tspan> Q</text>
  <text x="196.5" y="286" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#F2A93B" text-anchor="middle">WOOD-FIRED &amp; CRAFT BBQ</text>
  <text x="196.5" y="325" font-family="-apple-system, sans-serif" font-size="15" font-weight="500" fill="#B8B0A6" text-anchor="middle">Artisanal Hearth Crusts &amp; Texas Smokehouse</text>

  <!-- Login Form Container -->
  <g transform="translate(24, 370)">
    <!-- Email Input -->
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6">Email Address</text>
    <rect x="0" y="10" width="345" height="52" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="18" y="42" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">alex.turner@example.com</text>

    <!-- Password Input -->
    <text x="0" y="88" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6">Password</text>
    <rect x="0" y="98" width="345" height="52" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="18" y="132" font-family="-apple-system, sans-serif" font-size="16" fill="#B8B0A6">••••••••••••</text>
    <!-- Eye Icon -->
    <circle cx="320" cy="124" r="5" stroke="#7D756D" stroke-width="1.5" fill="none"/>

    <!-- Remember Me & Forgot Password -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="18" height="18" rx="5" fill="#FF5C1A"/>
      <path d="M4 9 L7.5 12.5 L14 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="28" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#B8B0A6">Remember me</text>
      <text x="345" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#F2A93B" text-anchor="end">Forgot Password?</text>
    </g>

    <!-- Sign In CTA Button -->
    <rect x="0" y="210" width="345" height="54" rx="16" fill="#FF5C1A"/>
    <text x="172.5" y="243" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign In to Crust &amp; Q</text>

    <!-- OR Divider -->
    <g transform="translate(0, 288)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="#332D27" stroke-width="1"/>
      <text x="172.5" y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#7D756D" text-anchor="middle">OR</text>
      <line x1="195" y1="0" x2="345" y2="0" stroke="#332D27" stroke-width="1"/>
    </g>

    <!-- Guest User Button -->
    <rect x="0" y="310" width="345" height="52" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="172.5" y="342" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue as Guest User</text>

    <!-- Sign Up Link -->
    <text x="172.5" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#B8B0A6" text-anchor="middle">Don't have an account? <tspan fill="#F2A93B" font-weight="700">Sign Up</tspan></text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>