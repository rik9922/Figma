<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382318"/>
      <stop offset="100%" stop-color="#26221E"/>
    </linearGradient>
    <filter id="cartShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(20, 62)">
    <!-- Location Section (Left) -->
    <path d="M6 14 C6 7.37 11.37 2 18 2 C24.63 2 30 7.37 30 14 C30 22 18 34 18 34 C18 34 6 22 6 14 Z" fill="#FF5C1A"/>
    <circle cx="18" cy="14" r="5" fill="#FFFFFF"/>
    
    <text x="38" y="16" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Home <tspan fill="#F2A93B" font-size="13">▼</tspan></text>
    <text x="38" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#B8B0A6">Orlando, 7th Street, Suite 402</text>

    <!-- Profile Circle (Right) -->
    <g transform="translate(315, 0)">
      <circle cx="20" cy="20" r="20" fill="#F2A93B"/>
      <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#141312" text-anchor="middle">R</text>
    </g>
  </g>

  <!-- Search Bar -->
  <g transform="translate(20, 116)">
    <rect width="353" height="48" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1.5"/>
    <!-- Magnifier Icon -->
    <circle cx="24" cy="24" r="6" stroke="#7D756D" stroke-width="1.8" fill="none"/>
    <line x1="28.5" y1="28.5" x2="34" y2="34" stroke="#7D756D" stroke-width="1.8" stroke-linecap="round"/>
    <text x="44" y="29" font-family="-apple-system, sans-serif" font-size="14" fill="#7D756D">Search "Wood-Fired Pizza, Ribs, Brisket..."</text>
    <!-- Voice Mic -->
    <rect x="324" y="17" width="5" height="10" rx="2.5" fill="#FF5C1A"/>
    <path d="M321 22 C321 25.5 323.5 28 326.5 28 C329.5 28 332 25.5 332 22" stroke="#FF5C1A" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Hero Promo Carousel (5 Cards Slider) -->
  <g transform="translate(20, 178)">
    <rect width="353" height="150" rx="18" fill="url(#heroCardGrad)" stroke="#332D27" stroke-width="1.5"/>
    
    <!-- Hero Content -->
    <rect x="18" y="16" width="90" height="22" rx="6" fill="#FF5C1A"/>
    <text x="63" y="31" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">CHEF'S SIGNATURE</text>

    <text x="18" y="66" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Dry-Aged Angus Ribeye</text>
    <text x="18" y="86" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#B8B0A6">Flame-seared with rosemary garlic butter</text>

    <!-- Order Now Button -->
    <rect x="18" y="104" width="105" height="32" rx="10" fill="#F2A93B"/>
    <text x="70" y="125" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#141312" text-anchor="middle">Order Now &gt;</text>

    <!-- Food Graphic Silhouette / Accent -->
    <circle cx="285" cy="75" r="50" fill="#141312" stroke="#4A423A" stroke-width="2"/>
    <text x="285" y="82" font-family="-apple-system, sans-serif" font-size="34" text-anchor="middle">🥩</text>

    <!-- 5 Carousel Pagination Dots -->
    <g transform="translate(145, 160)">
      <rect x="0" y="0" width="18" height="6" rx="3" fill="#FF5C1A"/>
      <circle cx="26" cy="3" r="3" fill="#7D756D" opacity="0.4"/>
      <circle cx="38" cy="3" r="3" fill="#7D756D" opacity="0.4"/>
      <circle cx="50" cy="3" r="3" fill="#7D756D" opacity="0.4"/>
      <circle cx="62" cy="3" r="3" fill="#7D756D" opacity="0.4"/>
    </g>
  </g>

  <!-- Category Bar -->
  <g transform="translate(20, 360)">
    <!-- Header -->
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Categories</text>
    <text x="353" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2A93B" text-anchor="end">See All / Full Menu &gt;</text>

    <!-- Category Pills -->
    <g transform="translate(0, 12)">
      <!-- All (Active) -->
      <rect x="0" y="0" width="62" height="34" rx="17" fill="#FF5C1A"/>
      <text x="31" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">All</text>

      <!-- Pizza -->
      <rect x="70" y="0" width="76" height="34" rx="17" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="108" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍕 Pizza</text>

      <!-- BBQ & Ribs -->
      <rect x="154" y="0" width="102" height="34" rx="17" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="205" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍖 BBQ &amp; Ribs</text>

      <!-- Burgers -->
      <rect x="264" y="0" width="89" height="34" rx="17" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="308" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍔 Burgers</text>
    </g>
  </g>

  <!-- Recommended Dishes Grid (Row 1) -->
  <g transform="translate(20, 435)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Recommended For You</text>

    <!-- Dish Card 1: Truffle Pizza -->
    <g transform="translate(0, 12)">
      <rect width="170" height="185" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <!-- Food Image Box -->
      <rect x="8" y="8" width="154" height="90" rx="10" fill="#1E1B18"/>
      <text x="85" y="60" font-family="-apple-system, sans-serif" font-size="34" text-anchor="middle">🍕</text>
      <!-- Rating Badge -->
      <rect x="14" y="14" width="46" height="18" rx="5" fill="#000000" opacity="0.7"/>
      <text x="37" y="27" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F2A93B" text-anchor="middle">★ 4.9</text>

      <!-- Details -->
      <text x="12" y="118" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Smoked Truffle Pizza</text>
      <text x="12" y="134" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#7D756D">20-25 mins • Blistered</text>
      <text x="12" y="165" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$21.50</text>

      <!-- Add Button -->
      <rect x="125" y="144" width="34" height="30" rx="9" fill="#FF5C1A"/>
      <text x="142" y="164" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
    </g>

    <!-- Dish Card 2: Smoked Ribs -->
    <g transform="translate(183, 12)">
      <rect width="170" height="185" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <rect x="8" y="8" width="154" height="90" rx="10" fill="#1E1B18"/>
      <text x="85" y="60" font-family="-apple-system, sans-serif" font-size="34" text-anchor="middle">🍖</text>
      <rect x="14" y="14" width="46" height="18" rx="5" fill="#000000" opacity="0.7"/>
      <text x="37" y="27" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F2A93B" text-anchor="middle">★ 4.8</text>

      <text x="12" y="118" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Smoked Spare Ribs</text>
      <text x="12" y="134" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#7D756D">25-30 mins • Glazed</text>
      <text x="12" y="165" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$26.50</text>

      <rect x="125" y="144" width="34" height="30" rx="9" fill="#FF5C1A"/>
      <text x="142" y="164" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Floating Cart Preview Pill -->
  <g transform="translate(20, 686)" filter="url(#cartShadow)">
    <rect width="353" height="50" rx="16" fill="#FF5C1A"/>
    <text x="20" y="31" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">🛒 2 items in Cart • $48.00</text>
    <text x="333" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="end">View Cart &gt;</text>
  </g>

  <!-- Floating Center Rounded Bottom Navigation Bar (2 Tabs) -->
  <g transform="translate(68, 752)">
    <rect width="257" height="60" rx="30" fill="#1E1B18" stroke="#4A423A" stroke-width="1.5"/>
    
    <!-- Delivery Tab (Active) -->
    <rect x="8" y="7" width="115" height="46" rx="23" fill="#FF5C1A"/>
    <text x="65" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">🛵 Delivery</text>

    <!-- History Tab -->
    <text x="190" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#B8B0A6" text-anchor="middle">🧾 History</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>