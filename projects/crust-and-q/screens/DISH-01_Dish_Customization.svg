<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#000000" fill-opacity="0.8"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Modal Container -->
  <g transform="translate(0, 120)">
    <rect width="393" height="732" rx="28" fill="#2E2A25" stroke="#332D27" stroke-width="1.5"/>
    <!-- Pull Pill -->
    <rect x="176" y="12" width="40" height="5" rx="2.5" fill="#7D756D" opacity="0.5"/>

    <!-- Hero Food Box -->
    <rect x="20" y="32" width="353" height="150" rx="18" fill="#1E1B18"/>
    <text x="196.5" y="115" font-family="-apple-system, sans-serif" font-size="54" text-anchor="middle">🍕</text>
    <!-- Close Button -->
    <circle cx="345" cy="52" r="14" fill="#000000" fill-opacity="0.6"/>
    <text x="345" y="57" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">✕</text>

    <!-- Dish Header -->
    <text x="24" y="212" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Smoked Truffle Pizza</text>
    <text x="24" y="232" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Airy blistered sourdough crust, San Marzano base, fontina, wild mushrooms, fresh black truffle shavings.</text>
    <text x="24" y="258" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F2A93B">$21.50</text>

    <!-- Section 1: Choose Crust (Required) -->
    <g transform="translate(24, 276)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Choose Crust Style <tspan fill="#FF5C1A">*</tspan></text>
      
      <!-- Option 1 (Selected) -->
      <g transform="translate(0, 10)">
        <rect width="345" height="42" rx="12" fill="#1E1B18" stroke="#FF5C1A" stroke-width="1.5"/>
        <circle cx="24" cy="21" r="8" fill="#FF5C1A"/>
        <circle cx="24" cy="21" r="3" fill="#FFFFFF"/>
        <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Wood-Fired Thin Neapolitan</text>
        <text x="325" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F2A93B" text-anchor="end">Included</text>
      </g>

      <!-- Option 2 -->
      <g transform="translate(0, 58)">
        <rect width="345" height="42" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1"/>
        <circle cx="24" cy="21" r="8" stroke="#4A423A" stroke-width="1.5" fill="none"/>
        <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#B8B0A6">Stuffed Mozzarella Crust</text>
        <text x="325" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F2A93B" text-anchor="end">+$2.50</text>
      </g>
    </g>

    <!-- Section 2: Premium Extra Toppings -->
    <g transform="translate(24, 396)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Add Premium Toppings</text>
      
      <!-- Checkbox 1 -->
      <g transform="translate(0, 10)">
        <rect width="345" height="38" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
        <rect x="14" y="11" width="16" height="16" rx="4" fill="#FF5C1A"/>
        <text x="22" y="23" font-family="-apple-system, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="40" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Wood-Smoked Bacon</text>
        <text x="325" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F2A93B" text-anchor="end">+$2.00</text>
      </g>

      <!-- Checkbox 2 -->
      <g transform="translate(0, 54)">
        <rect width="345" height="38" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
        <rect x="14" y="11" width="16" height="16" rx="4" stroke="#4A423A" stroke-width="1.5" fill="none"/>
        <text x="40" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#B8B0A6">Extra Fresh Buffalo Mozzarella</text>
        <text x="325" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#F2A93B" text-anchor="end">+$2.50</text>
      </g>
    </g>

    <!-- Bottom Add Bar -->
    <g transform="translate(24, 520)">
      <!-- Quantity Stepper -->
      <rect width="110" height="52" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#B8B0A6">-</text>
      <text x="55" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="86" y="32" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF5C1A">+</text>

      <!-- Add to Order CTA -->
      <rect x="124" y="0" width="221" height="52" rx="14" fill="#FF5C1A"/>
      <text x="234.5" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Order • $23.50</text>
    </g>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>