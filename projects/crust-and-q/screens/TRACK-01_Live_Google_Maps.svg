<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-Bleed Dark City Map Canvas -->
  <rect width="393" height="852" fill="#141312"/>

  <!-- Streets & Parks Grid -->
  <g fill="#1E1B18" stroke="#26221E" stroke-width="2">
    <rect x="15" y="70" width="90" height="120" rx="8"/>
    <rect x="120" y="70" width="140" height="80" rx="8"/>
    <rect x="275" y="70" width="100" height="100" rx="8"/>

    <rect x="15" y="210" width="130" height="100" rx="8"/>
    <rect x="160" y="170" width="100" height="140" rx="8"/>
    <rect x="275" y="190" width="100" height="160" rx="8"/>
  </g>

  <!-- Lake Eola -->
  <path d="M140 230 C185 210 235 225 250 260 C265 295 245 320 205 325 C165 330 125 305 120 275 Z" fill="#18232C" stroke="#233543" stroke-width="2"/>
  <text x="185" y="280" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#4B6984" text-anchor="middle">LAKE EOLA</text>

  <!-- Road Network -->
  <g stroke="#322C26" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="115" y1="0" x2="115" y2="500"/>
    <line x1="0" y1="460" x2="393" y2="460"/>
    <line x1="265" y1="0" x2="265" y2="500"/>
  </g>

  <!-- Animated Glowing Delivery Polyline -->
  <path d="M60 460 L115 460 L265 460 L265 240 L310 240" stroke="#FF5C1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 460 L115 460 L265 460 L265 240 L310 240" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Restaurant Hearth Marker (60, 460) -->
  <g transform="translate(60, 460)">
    <circle cx="0" cy="0" r="14" fill="#FF5C1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🍕</text>
  </g>

  <!-- Live Moving Driver Marker (265, 360) -->
  <g transform="translate(265, 360)">
    <!-- Radar Pulse -->
    <circle cx="0" cy="0" r="28" stroke="#FF5C1A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="0" cy="0" r="18" fill="#FF5C1A" fill-opacity="0.25"/>
    <circle cx="0" cy="0" r="12" fill="#FF5C1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">🛵</text>
  </g>

  <!-- Customer Home Marker (310, 240) -->
  <g transform="translate(310, 240)">
    <circle cx="0" cy="0" r="15" fill="#F2A93B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🏠</text>
  </g>

  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Top Floating Header Bar -->
  <g transform="translate(20, 64)" filter="url(#hudShadow)">
    <rect width="353" height="52" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <!-- Back Button -->
    <circle cx="26" cy="26" r="16" fill="#26221E"/>
    <text x="26" y="31" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">&lt;</text>
    
    <text x="56" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Order #CQ-8492</text>
    <text x="56" y="42" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#F2A93B">Live Google Maps Tracking</text>

    <!-- Share Button -->
    <rect x="290" y="12" width="50" height="28" rx="8" fill="#26221E"/>
    <text x="315" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#B8B0A6" text-anchor="middle">Share</text>
  </g>

  <!-- Live ETA Floating Pill -->
  <g transform="translate(86, 130)" filter="url(#hudShadow)">
    <rect width="220" height="42" rx="21" fill="#FF5C1A"/>
    <text x="110" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">⏱️ Arriving in 14 mins</text>
  </g>

  <!-- Bottom Order Status & Driver Sheet -->
  <g transform="translate(0, 480)" filter="url(#hudShadow)">
    <rect width="393" height="372" rx="28" fill="#2E2A25" stroke="#332D27" stroke-width="1.5"/>
    <!-- Pull Pill -->
    <rect x="176" y="10" width="40" height="5" rx="2.5" fill="#7D756D" opacity="0.5"/>

    <!-- 4-Stage Stepper -->
    <g transform="translate(30, 36)">
      <!-- Step 1: Confirmed -->
      <circle cx="10" cy="10" r="10" fill="#2E7D32"/>
      <text x="10" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="10" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#B8B0A6" text-anchor="middle">Placed</text>

      <line x1="25" y1="10" x2="95" y2="10" stroke="#2E7D32" stroke-width="2"/>

      <!-- Step 2: Baking -->
      <circle cx="110" cy="10" r="10" fill="#2E7D32"/>
      <text x="110" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="110" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#B8B0A6" text-anchor="middle">Baking</text>

      <line x1="125" y1="10" x2="195" y2="10" stroke="#FF5C1A" stroke-width="2"/>

      <!-- Step 3: On The Way (Active) -->
      <circle cx="210" cy="10" r="12" fill="#FF5C1A"/>
      <circle cx="210" cy="10" r="4" fill="#FFFFFF"/>
      <text x="210" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#FF5C1A" text-anchor="middle">On the way</text>

      <line x1="225" y1="10" x2="295" y2="10" stroke="#4A423A" stroke-width="2"/>

      <!-- Step 4: Delivered -->
      <circle cx="310" cy="10" r="10" fill="#1E1B18" stroke="#4A423A" stroke-width="2"/>
      <text x="310" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#7D756D" text-anchor="middle">Delivered</text>
    </g>

    <!-- Driver Card -->
    <g transform="translate(24, 96)">
      <rect width="345" height="88" rx="18" fill="#1E1B18" stroke="#332D27" stroke-width="1.5"/>
      <!-- Driver Photo Avatar -->
      <circle cx="44" cy="44" r="26" fill="#2E2A25" stroke="#F2A93B" stroke-width="2"/>
      <text x="44" y="52" font-family="-apple-system, sans-serif" font-size="24" text-anchor="middle">👨🏻‍🍳</text>

      <text x="82" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Marcus Vance</text>
      <text x="82" y="54" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F2A93B">★ 4.9 • 1,240 Deliveries</text>
      <text x="82" y="70" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Silver Toyota Prius • 7XYZ42</text>

      <!-- Action Buttons (Call / Chat) -->
      <circle cx="270" cy="44" r="18" fill="#2E2A25" stroke="#332D27" stroke-width="1"/>
      <text x="270" y="49" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">💬</text>

      <circle cx="315" cy="44" r="18" fill="#FF5C1A"/>
      <text x="315" y="49" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">📞</text>
    </g>

    <!-- Order Summary Drawer Bar -->
    <g transform="translate(24, 202)">
      <rect width="345" height="52" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1"/>
      <text x="20" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Order Items (2 items)</text>
      <text x="325" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2A93B" text-anchor="end">$41.99 ▼</text>
    </g>

    <!-- Emergency / Help Button -->
    <text x="196.5" y="290" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#7D756D" text-anchor="middle">Need assistance? <tspan fill="#F2A93B">Contact Crust &amp; Q Support</tspan></text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>