<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Driver Header Profile -->
  <g transform="translate(20, 64)">
    <circle cx="28" cy="28" r="28" fill="#26221E" stroke="#F2A93B" stroke-width="2"/>
    <text x="28" y="36" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">👨🏻‍🍳</text>
    
    <text x="68" y="24" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Marcus Vance</text>
    <text x="68" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#F2A93B">Gold Driver • ★ 4.94</text>
  </g>

  <!-- Online / Offline Toggle Banner -->
  <g transform="translate(20, 130)">
    <rect width="353" height="68" rx="18" fill="#1A2E1C" stroke="#2E7D32" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="10" fill="#2E7D32"/>
    <text x="56" y="30" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">You are Online</text>
    <text x="56" y="48" font-family="-apple-system, sans-serif" font-size="12" fill="#A3E6B4">Ready for Crust &amp; Q delivery dispatches</text>

    <!-- Toggle Switch -->
    <rect x="285" y="20" width="52" height="28" rx="14" fill="#2E7D32"/>
    <circle cx="323" cy="34" r="11" fill="#FFFFFF"/>
  </g>

  <!-- Today's Shift Performance Grid -->
  <g transform="translate(20, 218)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Today's Shift Earnings</text>
    
    <g transform="translate(0, 12)">
      <!-- Card 1: Earnings -->
      <rect width="110" height="90" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1"/>
      <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7D756D">EARNED</text>
      <text x="14" y="58" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#F2A93B">$142.50</text>

      <!-- Card 2: Deliveries -->
      <g transform="translate(121, 0)">
        <rect width="110" height="90" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1"/>
        <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7D756D">TRIPS</text>
        <text x="14" y="58" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">8</text>
      </g>

      <!-- Card 3: Online Hours -->
      <g transform="translate(242, 0)">
        <rect width="111" height="90" rx="14" fill="#26221E" stroke="#332D27" stroke-width="1"/>
        <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7D756D">HOURS</text>
        <text x="14" y="58" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">4.2h</text>
      </g>
    </g>
  </g>

  <!-- Incoming Order Dispatch Radar Card -->
  <g transform="translate(20, 350)">
    <rect width="353" height="220" rx="20" fill="#2E2A25" stroke="#FF5C1A" stroke-width="2"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FF5C1A">⚡ INCOMING DISPATCH READY</text>
    
    <text x="20" y="64" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Crust &amp; Q Smokehouse</text>
    <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="12.5" fill="#B8B0A6">Pickup: Counter 2 • 0.8 mi away</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#F2A93B">$11.25 <tspan font-size="12" font-weight="500" fill="#7D756D">(incl. $3.50 tip)</tspan></text>

    <text x="20" y="142" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF">Dropoff: Orlando, 7th Street (3.4 mi)</text>

    <!-- Accept CTA -->
    <rect x="20" y="160" width="313" height="46" rx="12" fill="#FF5C1A"/>
    <text x="176.5" y="189" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Accept Delivery Dispatch (15s)</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>