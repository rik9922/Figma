<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <filter id="drvShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Bleed Map -->
  <rect width="393" height="852" fill="#141312"/>

  <!-- Streets Layout -->
  <g stroke="#322C26" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <line x1="196" y1="0" x2="196" y2="852"/>
    <line x1="0" y1="380" x2="393" y2="380"/>
  </g>

  <!-- Route Polyline (Ahead of Driver) -->
  <path d="M196 520 L196 380 L320 380 L320 200" stroke="#FF5C1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 520 L196 380 L320 380 L320 200" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Driver Vehicle Heading Forward (196, 520) -->
  <g transform="translate(196, 520)">
    <circle cx="0" cy="0" r="32" stroke="#FF5C1A" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="#FF5C1A" fill-opacity="0.2"/>
    <!-- Vehicle -->
    <rect x="-10" y="-18" width="20" height="36" rx="6" fill="#141312" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-8" y="-16" width="16" height="32" rx="4" fill="#FF5C1A"/>
    <circle cx="-5" cy="-16" r="2" fill="#FFF275"/>
    <circle cx="5" cy="-16" r="2" fill="#FFF275"/>
  </g>

  <!-- Destination Customer Pin (320, 200) -->
  <g transform="translate(320, 200)">
    <circle cx="0" cy="0" r="16" fill="#F2A93B" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">🏠</text>
  </g>

  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Turn-by-Turn Instruction Banner (Top) -->
  <g transform="translate(16, 62)" filter="url(#drvShadow)">
    <rect width="361" height="88" rx="20" fill="#1C3822" stroke="#2E7D32" stroke-width="2"/>
    <!-- Turn Arrow Icon -->
    <g transform="translate(24, 24)">
      <circle cx="20" cy="20" r="20" fill="#2E7D32"/>
      <path d="M16 28 V16 H24 M21 12 L26 16 L21 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="80" y="42" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">In 300 ft</text>
    <text x="80" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#A3E6B4">Turn Right onto Palm Ave</text>
  </g>

  <!-- Speed & ETA Floating HUD -->
  <g transform="translate(16, 162)" filter="url(#drvShadow)">
    <rect width="180" height="42" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1.5"/>
    <text x="90" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">11 min • 3.4 mi • 32 mph</text>
  </g>

  <!-- Bottom Customer Info & "I Have Arrived" Drawer -->
  <g transform="translate(0, 580)" filter="url(#drvShadow)">
    <rect width="393" height="272" rx="28" fill="#2E2A25" stroke="#332D27" stroke-width="1.5"/>
    <!-- Pull Pill -->
    <rect x="176" y="10" width="40" height="5" rx="2.5" fill="#7D756D" opacity="0.5"/>

    <!-- Customer Card -->
    <g transform="translate(24, 28)">
      <circle cx="24" cy="24" r="22" fill="#1E1B18" stroke="#F2A93B" stroke-width="1.5"/>
      <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F2A93B" text-anchor="middle">SJ</text>

      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Sarah Jenkins</text>
      <text x="60" y="38" font-family="-apple-system, sans-serif" font-size="12.5" fill="#B8B0A6">Orlando, 7th Street, Apt 402</text>

      <!-- Contact Buttons -->
      <circle cx="280" cy="24" r="18" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="280" y="29" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">💬</text>

      <circle cx="325" cy="24" r="18" fill="#FF5C1A"/>
      <text x="325" y="29" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">📞</text>
    </g>

    <!-- Delivery Instructions Note -->
    <g transform="translate(24, 88)">
      <rect width="345" height="52" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F2A93B">DELIVERY NOTE:</text>
      <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF">"Apt 4B, please dial #0412 at callbox or leave on porch"</text>
    </g>

    <!-- Primary Action: "I Have Arrived" -->
    <rect x="24" y="156" width="345" height="56" rx="16" fill="#FF5C1A"/>
    <text x="196.5" y="191" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">I Have Arrived at Location</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>