<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <!-- Background Dim Overlay -->
  <rect width="393" height="852" fill="#000000" fill-opacity="0.75"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Bottom Sheet Container -->
  <g transform="translate(0, 310)">
    <rect width="393" height="542" rx="28" fill="#2E2A25" stroke="#332D27" stroke-width="1.5"/>
    <!-- Pull Pill -->
    <rect x="176" y="12" width="40" height="5" rx="2.5" fill="#7D756D" opacity="0.5"/>

    <!-- Header -->
    <text x="24" y="48" font-family="-apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Select Delivery Address</text>
    <!-- Close Icon -->
    <circle cx="360" cy="42" r="14" fill="#1E1B18"/>
    <text x="360" y="47" font-family="-apple-system, sans-serif" font-size="14" fill="#B8B0A6" text-anchor="middle">✕</text>

    <!-- Location Permission Card -->
    <g transform="translate(24, 75)">
      <rect width="345" height="72" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <circle cx="36" cy="36" r="18" fill="#382318"/>
      <text x="36" y="42" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">📍</text>
      
      <text x="66" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Device location not enabled</text>
      <text x="66" y="48" font-family="-apple-system, sans-serif" font-size="11.5" fill="#B8B0A6">Enable GPS for accurate doorstep delivery</text>

      <rect x="265" y="20" width="68" height="32" rx="10" fill="#FF5C1A"/>
      <text x="299" y="41" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enable</text>
    </g>

    <!-- Saved Addresses Heading -->
    <text x="24" y="180" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Saved Addresses</text>

    <!-- Address 1: Home (Selected) -->
    <g transform="translate(24, 198)">
      <rect width="345" height="74" rx="16" fill="#26221E" stroke="#FF5C1A" stroke-width="1.8"/>
      <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">🏠 Home</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="12.5" fill="#B8B0A6">Orlando, 7th Street, Suite 402, FL 32801</text>
      <circle cx="320" cy="37" r="10" fill="#FF5C1A"/>
      <circle cx="320" cy="37" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Address 2: Office -->
    <g transform="translate(24, 284)">
      <rect width="345" height="74" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">🏢 Office</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="12.5" fill="#B8B0A6">400 S Orange Ave, 12th Floor, Orlando, FL</text>
      <circle cx="320" cy="37" r="10" stroke="#4A423A" stroke-width="2" fill="none"/>
    </g>

    <!-- Search Manual Address -->
    <g transform="translate(24, 372)">
      <rect width="345" height="50" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1.5"/>
      <text x="18" y="31" font-family="-apple-system, sans-serif" font-size="14" fill="#7D756D">🔍 Search address manually...</text>
    </g>

    <!-- Add New Address Button -->
    <rect x="24" y="440" width="345" height="52" rx="16" fill="#FF5C1A"/>
    <text x="196.5" y="472" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add New Delivery Address</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>