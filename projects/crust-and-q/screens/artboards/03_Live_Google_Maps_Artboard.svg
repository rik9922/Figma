      <g transform="translate(8, 8)" color="#111827"><polyline points="15,18 9,12 15,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      
      <rect x="52" y="0" width="220" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="70" cy="20" r="5" fill="#D93B18"/>
