      <text x="196.5" y="74" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🔥</text>

      <text x="196.5" y="130" font-family="-apple-system, sans-serif" font-size="21" font-weight="900" fill="#111827" text-anchor="middle">Sign In to Place Your Order</text>
      <text x="196.5" y="156" font-family="-apple-system, sans-serif" font-size="13.5" fill="#4B5563" text-anchor="middle">Log in or create an account to save delivery addresses,</text>
      <text x="196.5" y="174" font-family="-apple-system, sans-serif" font-size="13.5" fill="#4B5563" text-anchor="middle">track your driver live on Google Maps, and earn points.</text>

