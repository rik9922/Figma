      <text x="96" y="48" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Wild chanterelles, fontina, truffle</text>
      <text x="96" y="74" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$21.50</text>

      <rect x="295" y="32" width="46" height="32" rx="10" fill="#FF5C1A"/>
      <text x="318" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>

