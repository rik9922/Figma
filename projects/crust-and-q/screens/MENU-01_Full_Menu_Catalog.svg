<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(20, 64)">
    <circle cx="18" cy="18" r="18" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <text x="18" y="23" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">&lt;</text>
    <text x="48" y="24" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Full Menu &amp; Hearth</text>
  </g>

  <!-- Sticky Category Pills -->
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="60" height="32" rx="16" fill="#FF5C1A"/>
    <text x="30" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">All (24)</text>

    <rect x="68" y="0" width="76" height="32" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="106" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍕 Pizza</text>

    <rect x="152" y="0" width="102" height="32" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="203" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍖 BBQ &amp; Ribs</text>

    <rect x="262" y="0" width="91" height="32" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="307" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6" text-anchor="middle">🍔 Burgers</text>
  </g>

  <!-- Filter Chips -->
  <g transform="translate(20, 160)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <text x="50" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#B8B0A6" text-anchor="middle">🌱 Vegetarian</text>

    <rect x="108" y="0" width="80" height="26" rx="13" fill="#26221E" stroke="#332D27" stroke-width="1"/>
