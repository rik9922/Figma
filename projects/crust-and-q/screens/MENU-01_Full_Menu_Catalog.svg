    <g transform="translate(0, 108)">
      <rect width="353" height="96" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <rect x="10" y="10" width="76" height="76" rx="12" fill="#1E1B18"/>
      <text x="48" y="54" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🍖</text>

      <text x="96" y="32" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Texas Smoked Prime Brisket</text>
      <text x="96" y="48" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">14-hour hickory bark, pickles, toast</text>
      <text x="96" y="74" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$28.00</text>

      <rect x="295" y="32" width="46" height="32" rx="10" fill="#FF5C1A"/>
      <text x="318" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>

    <!-- Dish 3 -->
    <g transform="translate(0, 216)">
      <rect width="353" height="96" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <rect x="10" y="10" width="76" height="76" rx="12" fill="#1E1B18"/>
      <text x="48" y="54" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🥩</text>

      <text x="96" y="32" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Dry-Aged Angus Ribeye (16oz)</text>
      <text x="96" y="48" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Flame-seared, garlic herb butter</text>
      <text x="96" y="74" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$34.00</text>

      <rect x="295" y="32" width="46" height="32" rx="10" fill="#FF5C1A"/>
      <text x="318" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>

    <!-- Dish 4 -->
    <g transform="translate(0, 324)">
      <rect width="353" height="96" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <rect x="10" y="10" width="76" height="76" rx="12" fill="#1E1B18"/>
      <text x="48" y="54" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🍔</text>

      <text x="96" y="32" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Double Brisket Smash Burger</text>
      <text x="96" y="48" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Lacy smash patties, cheddar, brisket</text>
      <text x="96" y="74" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B">$16.50</text>

      <rect x="295" y="32" width="46" height="32" rx="10" fill="#FF5C1A"/>
      <text x="318" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>
