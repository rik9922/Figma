<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <!-- Time -->
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Icons (Signal, Wifi, Battery) -->
    <g transform="translate(325, 26)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <!-- Battery -->
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Top Header Navigation -->
  <g transform="translate(24, 70)">
    <circle cx="18" cy="18" r="18" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <path d="M21 12 L15 18 L21 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Create Account</text>
  </g>

  <text x="24" y="130" font-family="-apple-system, sans-serif" font-size="14" fill="#B8B0A6">Join Crust &amp; Q Rewards &amp; track live deliveries</text>

  <!-- Form Fields -->
  <g transform="translate(24, 160)">
    <!-- First & Last Name Grid -->
    <g>
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">First Name</text>
      <rect x="0" y="8" width="164" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">Alex</text>

      <text x="181" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">Last Name</text>
      <rect x="181" y="8" width="164" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="195" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">Turner</text>
    </g>

    <!-- Phone Number -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">Phone Number</text>
      <rect x="0" y="8" width="345" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">+1 (407) 555-0192</text>
    </g>

    <!-- Email Address -->
    <g transform="translate(0, 152)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">Email Address</text>
      <rect x="0" y="8" width="345" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">alex.turner@example.com</text>
    </g>

    <!-- Password -->
    <g transform="translate(0, 228)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">Password</text>
      <rect x="0" y="8" width="345" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">••••••••••••</text>
    </g>

    <!-- Confirm Password -->
    <g transform="translate(0, 304)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#B8B0A6">Confirm Password</text>
      <rect x="0" y="8" width="345" height="48" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
      <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#FFFFFF">••••••••••••</text>
    </g>

    <!-- Terms -->
    <text x="0" y="390" font-family="-apple-system, sans-serif" font-size="12" fill="#7D756D">By signing up, you agree to our <tspan fill="#F2A93B">Terms</tspan> &amp; <tspan fill="#F2A93B">Privacy Policy</tspan>.</text>

    <!-- Sign Up Button -->
    <rect x="0" y="420" width="345" height="54" rx="16" fill="#FF5C1A"/>
    <text x="172.5" y="453" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Create Account</text>

    <text x="172.5" y="515" font-family="-apple-system, sans-serif" font-size="14" fill="#B8B0A6" text-anchor="middle">Already have an account? <tspan fill="#F2A93B" font-weight="700">Sign In</tspan></text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>