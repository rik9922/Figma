<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(20, 64)">
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">My Order History</text>
  </g>

  <!-- Sub-Tabs: Active Orders (1) | Past Orders (14) -->
  <g transform="translate(20, 108)">
    <rect x="0" y="0" width="168" height="36" rx="18" fill="#FF5C1A"/>
    <text x="84" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Active Orders (1)</text>

    <rect x="180" y="0" width="168" height="36" rx="18" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="264" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">Past Orders (14)</text>
  </g>

  <!-- Active Order Card -->
  <g transform="translate(20, 160)">
    <rect width="353" height="150" rx="18" fill="#26221E" stroke="#FF5C1A" stroke-width="1.8"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2A93B">ORDER #CQ-8492 • TODAY</text>
    <text x="335" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF5C1A" text-anchor="end">ON THE WAY</text>

    <text x="18" y="54" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2 Items • $41.99</text>
    <text x="18" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#B8B0A6">1x Smoked Truffle Pizza, 1x Double Smash Burger</text>

    <!-- Progress Bar -->
    <rect x="18" y="90" width="317" height="6" rx="3" fill="#332D27"/>
    <rect x="18" y="90" width="220" height="6" rx="3" fill="#FF5C1A"/>

    <!-- Track Live Button -->
    <rect x="18" y="106" width="317" height="32" rx="10" fill="#FF5C1A"/>
    <text x="176.5" y="126" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Track Live on Google Maps &gt;</text>
  </g>

  <!-- Past Orders List Heading -->
  <text x="20" y="340" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Recent Delivered Orders</text>

  <!-- Past Order 1 -->
  <g transform="translate(20, 355)">
    <rect width="353" height="110" rx="16" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#B8B0A6">OCT 24, 2026 • 7:15 PM</text>
    <text x="335" y="26" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="end">✓ Delivered</text>

    <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Smoked Spare Ribs, Garlic Knots</text>
    <text x="18" y="68" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#F2A93B">$34.50</text>

    <rect x="255" y="60" width="80" height="32" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <text x="295" y="80" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reorder</text>
  </g>

  <!-- Floating Center Bottom Navigation Bar -->
  <g transform="translate(68, 752)">
    <rect width="257" height="60" rx="30" fill="#1E1B18" stroke="#4A423A" stroke-width="1.5"/>
    <text x="65" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#B8B0A6" text-anchor="middle">🛵 Delivery</text>
    <rect x="135" y="7" width="115" height="46" rx="23" fill="#FF5C1A"/>
    <text x="192" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">🧾 History</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>