<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(20, 64)">
    <circle cx="18" cy="18" r="18" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <text x="18" y="23" font-family="-apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">&lt;</text>
    <text x="48" y="24" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Your Order Cart</text>
  </g>

  <!-- Delivery Destination Summary -->
  <g transform="translate(20, 114)">
    <rect width="353" height="64" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">🏠 Delivering to: Home</text>
    <text x="18" y="46" font-family="-apple-system, sans-serif" font-size="12" fill="#B8B0A6">Orlando, 7th Street, Suite 402 • ⏱️ 25-35 mins</text>
    <text x="335" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2A93B" text-anchor="end">Change</text>
  </g>

  <!-- Itemized Dishes -->
  <g transform="translate(20, 192)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="353" height="78" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1x Smoked Truffle Pizza</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Thin Neapolitan, Extra Bacon</text>
      <text x="16" y="62" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#F2A93B">$23.50</text>
      <text x="335" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#7D756D" text-anchor="end">🗑️</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 88)">
      <rect width="353" height="78" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1x Double Brisket Smash Burger</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="11.5" fill="#7D756D">Brioche bun, cheddar, pickles</text>
      <text x="16" y="62" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#F2A93B">$16.50</text>
      <text x="335" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#7D756D" text-anchor="end">🗑️</text>
    </g>
  </g>

  <!-- Promo Code Box -->
  <g transform="translate(20, 372)">
    <rect width="353" height="46" rx="12" fill="#26221E" stroke="#332D27" stroke-width="1"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">🏷️ CRUST20 [Applied: 20% Off]</text>
    <text x="335" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2A93B" text-anchor="end">-$8.00</text>
  </g>

  <!-- Driver Tip Selector -->
  <g transform="translate(20, 432)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Add Tip for Delivery Driver</text>
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="76" height="34" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
      <text x="38" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">$2.00</text>

      <rect x="86" y="0" width="76" height="34" rx="10" fill="#FF5C1A"/>
      <text x="124" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">$3.50</text>

      <rect x="172" y="0" width="76" height="34" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
      <text x="210" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">$5.00</text>

      <rect x="258" y="0" width="95" height="34" rx="10" fill="#26221E" stroke="#332D27" stroke-width="1"/>
      <text x="305" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#B8B0A6" text-anchor="middle">Custom</text>
    </g>
  </g>

  <!-- Bill Summary Breakdown -->
  <g transform="translate(20, 500)">
    <rect width="353" height="150" rx="16" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Item Subtotal</text>
    <text x="335" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end">$40.00</text>

    <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="13" fill="#FF5C1A">Promo Discount</text>
    <text x="335" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF5C1A" text-anchor="end">-$8.00</text>

    <text x="18" y="76" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Delivery Fee</text>
    <text x="335" y="76" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end">$2.99</text>

    <text x="18" y="100" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Taxes &amp; Service Fee</text>
    <text x="335" y="100" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end">$3.50</text>

    <line x1="18" y1="114" x2="335" y2="114" stroke="#332D27" stroke-width="1"/>

    <text x="18" y="136" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Total Due</text>
    <text x="335" y="136" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#F2A93B" text-anchor="end">$41.99</text>
  </g>

  <!-- Place Order CTA Button -->
  <g transform="translate(20, 670)">
    <rect width="353" height="56" rx="16" fill="#FF5C1A"/>
    <text x="176.5" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Place Order • $41.99</text>
  </g>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>