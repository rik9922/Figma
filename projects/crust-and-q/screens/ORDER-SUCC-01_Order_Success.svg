<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Celebratory Center -->
  <g transform="translate(196.5, 230)">
    <circle cx="0" cy="0" r="54" fill="#382318" stroke="#FF5C1A" stroke-width="3"/>
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="44" text-anchor="middle">🔥</text>
  </g>

  <text x="196.5" y="330" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">Order Placed &amp; Baking!</text>
  <text x="196.5" y="356" font-family="-apple-system, sans-serif" font-size="14" fill="#B8B0A6" text-anchor="middle">Crust &amp; Q kitchen is preparing your wood-fired feast</text>

  <!-- Order Receipt Card -->
  <g transform="translate(24, 390)">
    <rect width="345" height="150" rx="18" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2A93B">ORDER ID: #CQ-8492</text>
    
    <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Estimated Delivery:</text>
    <text x="325" y="60" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="end">28-35 mins (6:42 PM)</text>

    <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="13" fill="#B8B0A6">Delivering to:</text>
    <text x="325" y="88" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end">Orlando, 7th Street, Apt 402</text>

    <line x1="20" y1="108" x2="325" y2="108" stroke="#332D27" stroke-width="1"/>

    <text x="20" y="130" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Total Paid</text>
    <text x="325" y="130" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#F2A93B" text-anchor="end">$41.99 (Apple Pay)</text>
  </g>

  <!-- Primary CTA: Track Live -->
  <g transform="translate(24, 570)">
    <rect width="345" height="56" rx="16" fill="#FF5C1A"/>
    <text x="172.5" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Track Order Live on Google Maps &gt;</text>
  </g>

  <!-- Secondary: Back to Home -->
  <text x="196.5" y="660" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#B8B0A6" text-anchor="middle">Back to Home Hub</text>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>