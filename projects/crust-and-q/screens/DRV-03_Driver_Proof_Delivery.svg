<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <rect width="393" height="852" fill="#141312"/>
  
  <!-- iOS Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="#141312"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#FFFFFF"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#FFFFFF"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#FFFFFF"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#FFFFFF"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(20, 64)">
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Complete Delivery #CQ-8492</text>
  </g>

  <!-- Proof Selection Tab -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="168" height="36" rx="18" fill="#FF5C1A"/>
    <text x="84" y="23" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">📸 Photo Drop-Off</text>

    <rect x="180" y="0" width="168" height="36" rx="18" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="264" y="23" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#B8B0A6" text-anchor="middle">✍️ Signature / PIN</text>
  </g>

  <!-- Photo Capture Preview Card -->
  <g transform="translate(20, 165)">
    <rect width="353" height="220" rx="18" fill="#26221E" stroke="#332D27" stroke-width="1.5"/>
    <circle cx="176.5" cy="95" r="32" fill="#1E1B18"/>
    <text x="176.5" y="104" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">📸</text>
    <text x="176.5" y="150" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tap to Capture Doorstep Photo</text>
    <text x="176.5" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#B8B0A6" text-anchor="middle">Ensure package and house/apt number are visible</text>
  </g>

  <!-- Driver Notes Input -->
  <g transform="translate(20, 410)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Driver Note (Optional)</text>
    <rect x="0" y="10" width="353" height="60" rx="14" fill="#1E1B18" stroke="#332D27" stroke-width="1"/>
    <text x="16" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF">"Left order on front porch table by door #4B"</text>
  </g>

  <!-- Complete Delivery CTA -->
  <g transform="translate(20, 520)">
    <rect width="353" height="56" rx="16" fill="#FF5C1A"/>
    <text x="176.5" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Confirm Drop-Off &amp; Complete Delivery</text>
  </g>

  <!-- Payout Notice -->
  <text x="196.5" y="605" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#F2A93B" text-anchor="middle">+$11.25 will be credited immediately to your balance</text>

  
  <!-- iOS Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>