<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Multi-level diffuse ambient shadow -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6441F"/>
      <stop offset="100%" stop-color="#CA3212"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <clipPath id="heroClip"><rect width="353" height="150" rx="18"/></clipPath>
    <clipPath id="dishCardClip"><rect width="170" height="100" rx="14"/></clipPath>
    <clipPath id="dishListClip"><rect width="76" height="76" rx="12"/></clipPath>
    <clipPath id="dishModalClip"><rect width="353" height="170" rx="18"/></clipPath>
    <clipPath id="circleDishClip"><circle cx="28" cy="28" r="24"/></clipPath>
  </defs>
  <g id="SCREEN_AUTH-01">
    <rect width="393" height="852" rx="44" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="1" y="1" width="391" height="850" rx="43" fill="#F8F9FA"/>
    
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="transparent"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#111827">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#111827"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#111827"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#111827"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111827"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#111827" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#111827"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#111827"/>
    </g>
  </g>

    <!-- Header Navigation -->
    <g transform="translate(24, 68)">
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
      <g transform="translate(8, 8)" color="#111827"><polyline points="15,18 9,12 15,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      <text x="50" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#111827">Create Your Account</text>
      <text x="50" y="42" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">Join the Smokehouse Club &amp; Earn Rewards</text>
    </g>

    <!-- Registration Form Fields -->
    <g transform="translate(24, 136)">
      <!-- Name Row (2 columns) -->
      <g transform="translate(0, 0)">
        <text x="4" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">FIRST NAME</text>
        <rect x="0" y="6" width="164" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="14" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#111827">Sarah</text>

        <text x="185" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">LAST NAME</text>
        <rect x="181" y="6" width="164" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="195" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#111827">Jenkins</text>
      </g>

      <!-- Phone Number -->
      <g transform="translate(0, 70)">
        <text x="4" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">PHONE NUMBER</text>
        <rect x="0" y="6" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="14" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#111827">+1 (407) 555-0198</text>
      </g>

      <!-- Email Address -->
      <g transform="translate(0, 140)">
        <text x="4" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">EMAIL ADDRESS</text>
        <rect x="0" y="6" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="14" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#111827">sarah.jenkins@gmail.com</text>
      </g>

      <!-- Password -->
      <g transform="translate(0, 210)">
        <text x="4" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">PASSWORD</text>
        <rect x="0" y="6" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="14" y="36" font-family="-apple-system, sans-serif" font-size="18" fill="#111827">••••••••••••</text>
      </g>

      <!-- Confirm Password -->
      <g transform="translate(0, 280)">
        <text x="4" y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563">CONFIRM PASSWORD</text>
        <rect x="0" y="6" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow3D)"/>
        <text x="14" y="36" font-family="-apple-system, sans-serif" font-size="18" fill="#111827">••••••••••••</text>
        <g transform="translate(315, 20)" color="#16A34A"><polyline points="20,6 9,17 4,12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      </g>

      <!-- Terms & Conditions -->
      <g transform="translate(0, 350)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#D93B18"/>
        <g transform="translate(-2, -2)" color="#FFFFFF"><polyline points="20,6 9,17 4,12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
        <text x="24" y="13" font-family="-apple-system, sans-serif" font-size="11.5" fill="#4B5563">I agree to Crust &amp; Q Terms of Service &amp; Privacy Policy</text>
      </g>

      <!-- Sign Up Button -->
      <g transform="translate(0, 385)" filter="url(#shadowElevated)">
        <rect width="345" height="54" rx="16" fill="url(#btnGrad)"/>
        <text x="172.5" y="33" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Create Account &amp; Start Ordering</text>
      </g>

      <!-- Back to Login Link -->
      <g transform="translate(172.5, 465)">
        <text font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
          <tspan fill="#4B5563">Already have an account? </tspan>
          <tspan fill="#D93B18" font-weight="800">Sign In</tspan>
        </text>
      </g>
    </g>

    
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#111827" opacity="0.3"/>
  </g>
  </g></svg>