<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Realistic 3D Soft Shadow for Cards -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- Deep Elevation Shadow for Modals & Floating Pills -->
    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- 3D Car Marker Drop Shadow -->
    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <!-- Primary Button 3D Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6441F"/>
      <stop offset="100%" stop-color="#CA3212"/>
    </linearGradient>

    <!-- Gold Accent 3D Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Clip Paths for Rounded Images -->
    <clipPath id="heroClip"><rect width="353" height="150" rx="18"/></clipPath>
    <clipPath id="dishCardClip"><rect width="170" height="100" rx="14"/></clipPath>
    <clipPath id="dishListClip"><rect width="76" height="76" rx="12"/></clipPath>
    <clipPath id="dishModalClip"><rect width="353" height="170" rx="18"/></clipPath>
  </defs>
  <g id="SCREEN_AUTH-01">
    <rect width="393" height="852" rx="44" fill="#FFFFFF" stroke="#CED4DA" stroke-width="2"/>
    <rect x="1" y="1" width="391" height="850" rx="43" fill="#FFFFFF"/>
    
  <!-- iOS Light Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="transparent"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#111827">9:41</text>
    <!-- Dynamic Island Pill -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Signal, Wifi, Battery -->
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#111827"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#111827"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#111827"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111827"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#111827" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#111827"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#111827"/>
    </g>
  </g>

    <!-- Header Navigation -->
    <g transform="translate(24, 70)">
      <circle cx="18" cy="18" r="18" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1"/>
      <path d="M21 12 L15 18 L21 24" stroke="#111827" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="50" y="25" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#111827">Create Account</text>
    </g>

    <text x="24" y="130" font-family="-apple-system, sans-serif" font-size="14" fill="#4B5563">Join Crust &amp; Q Rewards &amp; track live orders</text>

    <!-- Registration Fields -->
    <g transform="translate(24, 155)">
      <!-- Name Grid -->
      <g>
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">First Name</text>
        <rect x="0" y="8" width="164" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">Alex</text>

        <text x="181" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Last Name</text>
        <rect x="181" y="8" width="164" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="195" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">Turner</text>
      </g>

      <!-- Phone Number -->
      <g transform="translate(0, 76)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Phone Number (US)</text>
        <rect x="0" y="8" width="345" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">+1 (407) 555-0192</text>
      </g>

      <!-- Email Address -->
      <g transform="translate(0, 152)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Email Address</text>
        <rect x="0" y="8" width="345" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">alex.turner@example.com</text>
      </g>

      <!-- Password -->
      <g transform="translate(0, 228)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Password</text>
        <rect x="0" y="8" width="345" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">••••••••••••</text>
      </g>

      <!-- Confirm Password -->
      <g transform="translate(0, 304)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Confirm Password</text>
        <rect x="0" y="8" width="345" height="48" rx="12" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="14" y="38" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">••••••••••••</text>
      </g>

      <text x="0" y="392" font-family="-apple-system, sans-serif" font-size="12" fill="#9CA3AF">By registering, you agree to Crust &amp; Q's <tspan fill="#D93B18">Terms</tspan> &amp; <tspan fill="#D93B18">Privacy</tspan>.</text>

      <!-- Primary Sign Up CTA -->
      <rect x="0" y="420" width="345" height="54" rx="16" fill="url(#btnGrad)" filter="url(#shadow3D)"/>
      <text x="172.5" y="453" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Create Account</text>

      <text x="172.5" y="515" font-family="-apple-system, sans-serif" font-size="14" fill="#4B5563" text-anchor="middle">Already have an account? <tspan fill="#D93B18" font-weight="800">Sign In</tspan></text>
    </g>

    
  <!-- iOS Light Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#111827" opacity="0.3"/>
  </g>
  </g></svg>