<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Multi-level diffuse ambient shadow -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6441F"/>
      <stop offset="100%" stop-color="#CA3212"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <clipPath id="heroClip"><rect width="353" height="150" rx="18"/></clipPath>
    <clipPath id="dishCardClip"><rect width="170" height="100" rx="14"/></clipPath>
    <clipPath id="dishListClip"><rect width="76" height="76" rx="12"/></clipPath>
    <clipPath id="dishModalClip"><rect width="353" height="170" rx="18"/></clipPath>
    <clipPath id="circleDishClip"><circle cx="28" cy="28" r="24"/></clipPath>
  </defs>
  <g id="SCREEN_ORDER-SUCC-01">
    <rect width="393" height="852" rx="44" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="1" y="1" width="391" height="850" rx="43" fill="#FFFFFF"/>
    
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="transparent"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#111827">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#111827"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#111827"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#111827"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111827"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#111827" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#111827"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#111827"/>
    </g>
  </g>

    <!-- Glowing Checkmark Core -->
    <g transform="translate(196.5, 170)" filter="url(#shadowElevated)">
      <circle cx="0" cy="0" r="48" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
      <g transform="translate(-16, -16)" color="#16A34A">
        <path d="M6 16 L14 24 L28 8" stroke="#16A34A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Confirmation Titles -->
    <text x="196.5" y="260" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#111827" text-anchor="middle">Feast is Wood-Firing!</text>
    <text x="196.5" y="286" font-family="-apple-system, sans-serif" font-size="14.5" fill="#4B5563" text-anchor="middle">Order #CQ-8924 • Estimated Delivery: 22–28 mins</text>

    <!-- Order Summary Card -->
    <g transform="translate(20, 320)" filter="url(#shadow3D)">
      <rect width="353" height="220" rx="20" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#D93B18">DISPATCH DETAILS</text>

      <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#111827">Crust &amp; Q Smokehouse • Orlando Downtown</text>
      <text x="20" y="80" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">1x Smoked Truffle Mushroom Pie</text>
      <text x="20" y="98" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">1x Double Brisket Smash Burger</text>

      <line x1="20" y1="116" x2="333" y2="116" stroke="#E5E7EB" stroke-width="1"/>

      <text x="20" y="142" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#111827">Delivery Destination</text>
      <text x="20" y="160" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">Sarah Jenkins • 200 E Robinson St, Apt 402</text>
      <text x="20" y="196" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#D93B18">Total Paid: $41.99 via Apple Pay</text>
    </g>

    <!-- Primary Action: Track Live on Google Maps -->
    <g transform="translate(20, 570)" filter="url(#shadowElevated)">
      <rect width="353" height="56" rx="16" fill="url(#btnGrad)"/>
      <text x="176.5" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">Track Live on Google Maps ▸</text>
    </g>

    <!-- Secondary: Return Home -->
    <g transform="translate(20, 642)">
      <rect width="353" height="50" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="176.5" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Back to Menu</text>
    </g>

    
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#111827" opacity="0.3"/>
  </g>
  </g></svg>