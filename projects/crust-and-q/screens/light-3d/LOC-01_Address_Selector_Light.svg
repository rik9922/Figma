<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Realistic 3D Soft Shadow for Cards -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- Deep Elevation Shadow for Modals & Floating Pills -->
    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- 3D Car Marker Drop Shadow -->
    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <!-- Primary Button 3D Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6441F"/>
      <stop offset="100%" stop-color="#CA3212"/>
    </linearGradient>

    <!-- Gold Accent 3D Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Clip Paths for Rounded Images -->
    <clipPath id="heroClip"><rect width="353" height="150" rx="18"/></clipPath>
    <clipPath id="dishCardClip"><rect width="170" height="100" rx="14"/></clipPath>
    <clipPath id="dishListClip"><rect width="76" height="76" rx="12"/></clipPath>
    <clipPath id="dishModalClip"><rect width="353" height="170" rx="18"/></clipPath>
  </defs>
  <g id="SCREEN_LOC-01">
    <rect width="393" height="852" rx="44" fill="#F8F9FA" stroke="#CED4DA" stroke-width="2"/>
    <rect x="1" y="1" width="391" height="850" rx="43" fill="#000000" fill-opacity="0.35"/>
    
  <!-- iOS Light Dynamic Island & Status Bar -->
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="transparent"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#111827">9:41</text>
    <!-- Dynamic Island Pill -->
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <!-- Signal, Wifi, Battery -->
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#111827"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#111827"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#111827"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111827"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#111827" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#111827"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#111827"/>
    </g>
  </g>

    <!-- Bottom Sheet Container (White with Shadow) -->
    <g transform="translate(0, 310)" filter="url(#shadowElevated)">
      <rect width="393" height="542" rx="32" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="1"/>
      <rect x="176" y="12" width="40" height="5" rx="2.5" fill="#9CA3AF" opacity="0.4"/>

      <text x="24" y="48" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#111827">Select Delivery Address</text>
      <circle cx="360" cy="42" r="14" fill="#F1F3F5"/>
      <text x="360" y="47" font-family="-apple-system, sans-serif" font-size="13" fill="#4B5563" text-anchor="middle">✕</text>

      <!-- GPS Tile -->
      <g transform="translate(24, 75)" filter="url(#shadow3D)">
        <rect width="345" height="74" rx="16" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1"/>
        <circle cx="36" cy="37" r="18" fill="#FFF1EE"/>
        <text x="36" y="43" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">📍</text>
        
        <text x="66" y="31" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#111827">Device location not enabled</text>
        <text x="66" y="49" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">Enable GPS for live doorstep delivery</text>

        <rect x="265" y="21" width="68" height="32" rx="10" fill="url(#btnGrad)"/>
        <text x="299" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Enable</text>
      </g>

      <text x="24" y="180" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">Saved Addresses</text>

      <!-- Home (Selected) -->
      <g transform="translate(24, 198)" filter="url(#shadow3D)">
        <rect width="345" height="74" rx="16" fill="#FFFFFF" stroke="#D93B18" stroke-width="2"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#111827">🏠 Home</text>
        <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="12.5" fill="#4B5563">Orlando, 7th Street, Suite 402, FL 32801</text>
        <circle cx="320" cy="37" r="11" fill="#D93B18"/>
        <circle cx="320" cy="37" r="4" fill="#FFFFFF"/>
      </g>

      <!-- Office -->
      <g transform="translate(24, 284)" filter="url(#shadow3D)">
        <rect width="345" height="74" rx="16" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#111827">🏢 Office</text>
        <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="12.5" fill="#4B5563">400 S Orange Ave, 12th Floor, Orlando, FL</text>
        <circle cx="320" cy="37" r="10" stroke="#CED4DA" stroke-width="2" fill="none"/>
      </g>

      <!-- Manual Search -->
      <g transform="translate(24, 372)">
        <rect width="345" height="50" rx="14" fill="#F1F3F5" stroke="#E9ECEF" stroke-width="1.5"/>
        <text x="18" y="31" font-family="-apple-system, sans-serif" font-size="14" fill="#9CA3AF">🔍 Search address or landmark manually...</text>
      </g>

      <!-- Add New Address CTA -->
      <rect x="24" y="440" width="345" height="54" rx="16" fill="url(#btnGrad)" filter="url(#shadow3D)"/>
      <text x="196.5" y="473" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">+ Add New Delivery Address</text>
    </g>

    
  <!-- iOS Light Home Indicator -->
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#111827" opacity="0.3"/>
  </g>
  </g></svg>