<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Multi-level diffuse ambient shadow -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="carShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6441F"/>
      <stop offset="100%" stop-color="#CA3212"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <clipPath id="heroClip"><rect width="353" height="150" rx="18"/></clipPath>
    <clipPath id="dishCardClip"><rect width="170" height="100" rx="14"/></clipPath>
    <clipPath id="dishListClip"><rect width="76" height="76" rx="12"/></clipPath>
    <clipPath id="dishModalClip"><rect width="353" height="170" rx="18"/></clipPath>
    <clipPath id="circleDishClip"><circle cx="28" cy="28" r="24"/></clipPath>
  </defs>
  <g id="SCREEN_LOC-01">
    <rect width="393" height="852" rx="44" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="1" y="1" width="391" height="850" rx="43" fill="#000000" fill-opacity="0.45"/>
    
  <g id="StatusBar">
    <rect x="0" y="0" width="393" height="54" fill="transparent"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#111827">9:41</text>
    <rect x="134" y="11" width="125" height="34" rx="17" fill="#000000"/>
    <circle cx="238" cy="28" r="5.5" fill="#141312"/>
    <circle cx="238" cy="28" r="2.5" fill="#1A2035"/>
    <g transform="translate(325, 26)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#111827"/>
      <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#111827"/>
      <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#111827"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#111827"/>
      <rect x="22" y="1" width="22" height="11" rx="3" stroke="#111827" stroke-width="1.5" fill="none"/>
      <rect x="24" y="3" width="16" height="7" rx="1.5" fill="#111827"/>
      <path d="M45 4.5 C45.5 4.5 46 5 46 5.5 V7.5 C46 8 45.5 8.5 45 8.5 Z" fill="#111827"/>
    </g>
  </g>

    <!-- Close ✕ Circle (Exact position matching Reference Image 1) -->
    <circle cx="196.5" cy="380" r="18" fill="#1F2937" filter="url(#shadow3D)"/>
    <text x="196.5" y="386" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">✕</text>

    <!-- Address Bottom Sheet Container -->
    <g transform="translate(0, 410)" filter="url(#shadowElevated)">
      <rect width="393" height="442" rx="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="176" y="10" width="40" height="5" rx="2.5" fill="#9CA3AF" opacity="0.4"/>

      <!-- "Device Location Not Enabled" Alert Box (Exact Match to Reference Image 1) -->
      <g transform="translate(20, 26)" filter="url(#shadow3D)">
        <rect width="353" height="74" rx="16" fill="#F1F3F5" stroke="#E5E7EB" stroke-width="1"/>
        <!-- Red location cross pin -->
        <g transform="translate(16, 18)" color="#D93B18"><path d="M12 2C8.13 2 5 5.13 5 9c0 4.17 4.42 9.92 6.24 12.11a1 1 0 001.52 0C14.58 18.92 19 13.17 19 9c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z" fill="currentColor"/><line x1="4" y1="4" x2="20" y2="20" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/></g>
        <text x="50" y="32" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#111827">Device location not enabled</text>
        <text x="50" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#4B5563">Enable your device location for a better</text>
        <text x="50" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#4B5563">and faster delivery experience</text>

        <!-- Enable Red Button -->
        <rect x="264" y="20" width="75" height="34" rx="10" fill="url(#btnGrad)"/>
        <text x="301.5" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Enable</text>
      </g>

      <!-- Section Title: Select a saved address + See all link -->
      <g transform="translate(20, 126)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="15" font-weight="900" fill="#111827">Select a saved address</text>
        <text x="353" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#D93B18" text-anchor="end">See all</text>
      </g>

      <!-- Saved Address 1: Home (Lake Eola Heights, Orlando) -->
      <g transform="translate(20, 142)" filter="url(#shadow3D)">
        <rect width="353" height="70" rx="14" fill="#F1F3F5" stroke="#D93B18" stroke-width="1.5"/>
        <g transform="translate(18, 24)" color="#D93B18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="2" fill="none"/></g>
        <text x="50" y="30" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#111827">Home</text>
        <text x="50" y="48" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">200 E Robinson St, Apt 402, Lake Eola Heights, Orlando...</text>
        <g transform="translate(320, 26)" color="#D93B18"><polyline points="20,6 9,17 4,12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      </g>

      <!-- Saved Address 2: Office (Downtown Orlando Bank Center) -->
      <g transform="translate(20, 222)" filter="url(#shadow3D)">
        <rect width="353" height="70" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <g transform="translate(18, 24)" color="#4B5563"><path d="M4 22h16M4 2h16a1 1 0 011 1v19H3V3a1 1 0 011-1zM8 6h2M14 6h2M8 10h2M14 10h2M8 14h2M14 14h2M9 22v-4h6v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></g>
        <text x="50" y="30" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#111827">Office</text>
        <text x="50" y="48" font-family="-apple-system, sans-serif" font-size="12" fill="#4B5563">390 N Orange Ave, Ste 1400, Bank of America Center...</text>
      </g>

      <!-- Search location manually input (Exact Match to Reference Image 1) -->
      <g transform="translate(20, 304)" filter="url(#shadow3D)">
        <rect width="353" height="48" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
        <g transform="translate(16, 14)" color="#D93B18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="16.5" y1="16.5" x2="22" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
        <text x="46" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B5563">Search location manually</text>
        <g transform="translate(325, 14)" color="#9CA3AF"><polyline points="9,18 15,12 9,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      </g>
    </g>

    
  <g id="HomeIndicator">
    <rect x="120" y="838" width="153" height="5" rx="2.5" fill="#111827" opacity="0.3"/>
  </g>
  </g></svg>