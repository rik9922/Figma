<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140" fill="none">
  <defs>
    <linearGradient id="peelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="forkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="flameCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="65%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Emblem Group (120x120) -->
  <g transform="translate(10, 10)" filter="url(#logoShadow)">
    <!-- Hearth Cast-Iron Outer Ring -->
    <circle cx="60" cy="60" r="54" fill="#1C1917" stroke="#44403C" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="48" fill="#292524" stroke="#78350F" stroke-width="1"/>
    
    <!-- Diagonal Pizza Peel (-35 deg) -->
    <g transform="rotate(-35 60 60)">
      <rect x="57" y="16" width="6" height="88" rx="3" fill="url(#peelWood)"/>
      <path d="M42 16 C42 26 50 32 60 33 C70 32 78 26 78 16 Z" fill="url(#peelWood)" stroke="#F59E0B" stroke-width="1.2"/>
      <line x1="47" y1="20" x2="73" y2="20" stroke="#78350F" stroke-width="1"/>
    </g>

    <!-- Diagonal BBQ Fork (+35 deg) -->
    <g transform="rotate(35 60 60)">
      <rect x="57" y="16" width="6" height="88" rx="3" fill="url(#forkSteel)"/>
      <!-- Fork Prongs -->
      <path d="M48 16 V30 C48 34 54 36 60 36 C66 36 72 34 72 30 V16" stroke="url(#forkSteel)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="54" y1="16" x2="54" y2="28" stroke="url(#forkSteel)" stroke-width="2"/>
      <line x1="66" y1="16" x2="66" y2="28" stroke="url(#forkSteel)" stroke-width="2"/>
    </g>

    <!-- Center 3D Flame Ember Monogram Core -->
    <path d="M60 32 C50 45 47 56 52 66 C54 70 57 73 60 73 C63 73 66 70 68 66 C73 56 70 45 60 32 Z" fill="url(#flameCore)"/>
    <path d="M60 46 C55 52 54 58 57 63 C58 65 59 66 60 66 C61 66 62 65 63 63 C66 58 65 52 60 46 Z" fill="#FEF08A"/>
    
    <!-- Floating Embers -->
    <circle cx="44" cy="46" r="2" fill="#F59E0B"/>
    <circle cx="76" cy="42" r="2.5" fill="#EF4444"/>
    <circle cx="60" cy="24" r="2" fill="#FBBF24"/>
  </g>

  <!-- Typography Right Lockup -->
  <g transform="translate(145, 24)">
    <!-- Primary Name: CRUST & Q -->
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Georgia, serif" font-size="44" font-weight="900" letter-spacing="1" fill="#1C1917">CRUST <tspan fill="#D93B18">&amp;</tspan> Q</text>
    
    <!-- Subtitle: WOOD-FIRED & CRAFT SMOKEHOUSE -->
    <text x="2" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="3.5" fill="#B45309">WOOD-FIRED &amp; CRAFT SMOKEHOUSE</text>
    
    <!-- Origin Tag -->
    <text x="2" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#78716C">EST. 2024 • ORLANDO, FL</text>

    <!-- Accent Rule -->
    <rect x="2" y="104" width="280" height="2.5" rx="1" fill="#E7E5E4"/>
    <rect x="2" y="104" width="60" height="2.5" rx="1" fill="#D93B18"/>
  </g>
</svg>
