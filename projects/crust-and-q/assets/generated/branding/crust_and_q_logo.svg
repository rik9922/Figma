<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF5C1A"/>
      <stop offset="60%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#F2A93B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#D98A26"/>
    </linearGradient>
    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Emblem Graphic (Left) -->
  <g transform="translate(10, 10)">
    <!-- Hearth Glow Base -->
    <circle cx="50" cy="50" r="46" fill="#1E1B18" stroke="#3A342E" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="#26221E" />
    
    <!-- Crossed Wood-Fired Pizza Peel & BBQ Fork -->
    <!-- Pizza Peel (Diagonal Top-Left to Bottom-Right) -->
    <g transform="rotate(-30 50 50)">
      <rect x="47" y="15" width="6" height="70" rx="3" fill="#B8B0A6"/>
      <!-- Peel Head -->
      <path d="M35 15 C35 22 40 28 47 29 L53 29 C60 28 65 22 65 15 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- BBQ Fork (Diagonal Top-Right to Bottom-Left) -->
    <g transform="rotate(30 50 50)">
      <rect x="47" y="15" width="6" height="70" rx="3" fill="#8C827A"/>
      <!-- Fork Prongs -->
      <path d="M42 16 L42 26 C42 29 47 31 50 31 C53 31 58 29 58 26 L58 16 M46 16 L46 25 M54 16 L54 25" stroke="#E6E1DC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Center Leaping Flame & Glowing Embers -->
    <path d="M50 28 C43 38 41 47 45 54 C46 56 48 58 50 58 C52 58 54 56 55 54 C59 47 57 38 50 28 Z" fill="url(#flameGrad)" filter="url(#emberGlow)"/>
    <path d="M50 38 C47 43 46 48 48 52 C49 53 50 54 50 54 C51 54 52 53 53 52 C55 48 53 43 50 38 Z" fill="#FFF275"/>
    
    <!-- Sparks / Embers -->
    <circle cx="38" cy="36" r="1.5" fill="#FF5C1A"/>
    <circle cx="62" cy="34" r="2" fill="#F2A93B"/>
    <circle cx="50" cy="22" r="1.5" fill="#FF7A3D"/>
  </g>

  <!-- Typography Lockup (Right) -->
  <g transform="translate(125, 25)">
    <!-- Primary Logotype: CRUST & Q -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">CRUST <tspan fill="url(#flameGrad)">&amp;</tspan> Q</text>
    
    <!-- Subtitle: WOOD-FIRED & CRAFT BBQ -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.2" fill="#F2A93B">WOOD-FIRED &amp; CRAFT BBQ</text>
    
    <!-- Decorative Divider Line -->
    <rect x="2" y="76" width="220" height="2" rx="1" fill="#3A342E"/>
    <rect x="2" y="76" width="45" height="2" rx="1" fill="url(#flameGrad)"/>
  </g>
</svg>
