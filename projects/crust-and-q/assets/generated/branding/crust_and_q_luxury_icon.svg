<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="appIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F4"/>
    </linearGradient>
    <linearGradient id="peelWoodIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="forkSteelIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="flameCoreIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="65%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <filter id="iconSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle (512x512 with rx=115) -->
  <rect width="512" height="512" rx="115" fill="url(#appIconBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="#E7E5E4" stroke-width="4" fill="none"/>

  <!-- Center Hearth Disc (300px) with Drop Shadow -->
  <g transform="translate(256, 210)" filter="url(#iconSoftShadow)">
    <circle cx="0" cy="0" r="140" fill="#1C1917" stroke="#44403C" stroke-width="6"/>
    <circle cx="0" cy="0" r="126" fill="#292524" stroke="#78350F" stroke-width="2"/>

    <!-- Diagonal Peel (-35 deg) -->
    <g transform="rotate(-35)">
      <rect x="-8" y="-120" width="16" height="240" rx="8" fill="url(#peelWoodIcon)"/>
      <path d="M-45 -120 C-45 -95 -20 -80 0 -78 C20 -80 45 -95 45 -120 Z" fill="url(#peelWoodIcon)" stroke="#F59E0B" stroke-width="3"/>
    </g>

    <!-- Diagonal Fork (+35 deg) -->
    <g transform="rotate(35)">
      <rect x="-8" y="-120" width="16" height="240" rx="8" fill="url(#forkSteelIcon)"/>
      <path d="M-30 -120 V-85 C-30 -75 -15 -70 0 -70 C15 -70 30 -75 30 -85 V-120" stroke="url(#forkSteelIcon)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <line x1="-15" y1="-120" x2="-15" y2="-90" stroke="url(#forkSteelIcon)" stroke-width="5"/>
      <line x1="15" y1="-120" x2="15" y2="-90" stroke="url(#forkSteelIcon)" stroke-width="5"/>
    </g>

    <!-- Center 3D Flame Ember -->
    <path d="M0 -80 C-26 -46 -34 -18 -22 6 C-17 17 -8 24 0 24 C8 24 17 17 22 6 C34 -18 26 -46 0 -80 Z" fill="url(#flameCoreIcon)"/>
    <path d="M0 -42 C-14 -26 -16 -12 -10 2 C-7 8 -3 11 0 11 C3 11 7 8 10 2 C16 -12 14 -26 0 -42 Z" fill="#FEF08A"/>
    
    <circle cx="-38" cy="-45" r="4.5" fill="#F59E0B"/>
    <circle cx="42" cy="-55" r="5" fill="#EF4444"/>
    <circle cx="0" cy="-100" r="4.5" fill="#FBBF24"/>
  </g>

  <!-- Bottom Logotype Text inside App Icon -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Georgia, serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="#1C1917" text-anchor="middle">CRUST <tspan fill="#D93B18">&amp;</tspan> Q</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#B45309" text-anchor="middle">WOOD-FIRED &amp; BBQ</text>
</svg>
