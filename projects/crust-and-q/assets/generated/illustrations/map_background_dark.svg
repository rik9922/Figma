<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="routeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C1A"/>
      <stop offset="70%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#F2A93B"/>
    </linearGradient>
  </defs>

  <!-- Dark Ground Base -->
  <rect width="393" height="852" fill="#141312"/>

  <!-- City Blocks & Parks -->
  <g fill="#1E1B18" stroke="#26221E" stroke-width="1.5">
    <rect x="20" y="80" width="85" height="110" rx="8"/>
    <rect x="125" y="80" width="130" height="70" rx="8"/>
    <rect x="275" y="80" width="95" height="90" rx="8"/>

    <rect x="20" y="210" width="120" height="90" rx="8"/>
    <rect x="160" y="170" width="95" height="130" rx="8"/>
    <rect x="275" y="190" width="95" height="150" rx="8"/>

    <rect x="20" y="320" width="85" height="130" rx="8"/>
    <rect x="125" y="320" width="130" height="80" rx="8"/>
    <rect x="275" y="360" width="95" height="110" rx="8"/>

    <rect x="20" y="470" width="140" height="100" rx="8"/>
    <rect x="180" y="420" width="75" height="150" rx="8"/>
    <rect x="275" y="490" width="95" height="120" rx="8"/>

    <rect x="20" y="590" width="85" height="140" rx="8"/>
    <rect x="125" y="590" width="130" height="90" rx="8"/>
    <rect x="275" y="630" width="95" height="140" rx="8"/>
  </g>

  <!-- Lake / Water Body (Orlando Eola Lake Style) -->
  <path d="M135 220 C180 200 230 215 245 250 C260 285 240 310 200 315 C160 320 120 295 115 265 C110 235 125 225 135 220 Z" fill="#18232C" stroke="#233543" stroke-width="2"/>
  <text x="180" y="270" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#4B6984" text-anchor="middle" letter-spacing="1">LAKE EOLA PARK</text>

  <!-- Secondary Streets (Dark Charcoal) -->
  <g stroke="#26221E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal Streets -->
    <line x1="0" y1="70" x2="393" y2="70"/>
    <line x1="0" y1="200" x2="393" y2="200"/>
    <line x1="0" y1="310" x2="393" y2="310"/>
    <line x1="0" y1="460" x2="393" y2="460"/>
    <line x1="0" y1="580" x2="393" y2="580"/>
    <line x1="0" y1="730" x2="393" y2="730"/>

    <!-- Vertical Streets -->
    <line x1="115" y1="0" x2="115" y2="852"/>
    <line x1="265" y1="0" x2="265" y2="852"/>
  </g>

  <!-- Primary Arterials (Slightly Lighter with Central Dashes) -->
  <g stroke="#322C26" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="115" y1="0" x2="115" y2="852"/>
    <line x1="0" y1="460" x2="393" y2="460"/>
  </g>
  <g stroke="#3A342E" stroke-width="1" stroke-dasharray="6 6">
    <line x1="115" y1="0" x2="115" y2="852"/>
    <line x1="0" y1="460" x2="393" y2="460"/>
  </g>

  <!-- Street Labels -->
  <text x="60" y="454" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#8C827A" letter-spacing="1">ORANGE AVE</text>
  <text x="122" y="520" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#8C827A" letter-spacing="1" transform="rotate(90 122 520)">CENTRAL BLVD</text>
  <text x="310" y="304" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#8C827A" letter-spacing="1">7TH STREET</text>

  <!-- LIVE ROUTE POLYLINE (From Restaurant at Orange & 2nd to Customer at 7th St) -->
  <!-- Outer Route Shadow / Casing -->
  <path d="M60 620 L115 620 L115 460 L265 460 L265 240 L310 240" stroke="#141312" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route Main Line -->
  <path d="M60 620 L115 620 L115 460 L265 460 L265 240 L310 240" stroke="url(#routeGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)"/>
  <!-- Animated / Inner Route Pulse Line -->
  <path d="M60 620 L115 620 L115 460 L265 460 L265 240 L310 240" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- RESTAURANT PIN (Crust & Q Kitchen: 60, 620) -->
  <g transform="translate(60, 620)">
    <circle cx="0" cy="0" r="14" fill="#FF5C1A" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M0 -7 C-3 -3 -4 0 -2 3 C-1 4 0 5 0 5 C0 5 1 4 2 3 C4 0 3 -3 0 -7 Z" fill="#FFFFFF"/>
    <!-- Label -->
    <rect x="-42" y="18" width="84" height="20" rx="6" fill="#1E1B18" stroke="#3A342E" stroke-width="1"/>
    <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#FF5C1A" text-anchor="middle">Crust &amp; Q Kitchen</text>
  </g>

  <!-- LIVE DRIVER VEHICLE (Currently at Central Blvd & 7th St: 265, 380) -->
  <g transform="translate(265, 380)">
    <!-- Radar Pulse Rings -->
    <circle cx="0" cy="0" r="28" stroke="#FF5C1A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="#FF5C1A" fill-opacity="0.2"/>
    <!-- Vehicle Heading -->
    <g transform="rotate(-90)">
      <rect x="-8" y="-14" width="16" height="28" rx="6" fill="#141312" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-6" y="-12" width="12" height="24" rx="4" fill="#FF5C1A"/>
      <rect x="-4" y="-8" width="8" height="6" rx="2" fill="#141312"/>
      <circle cx="-4" cy="-12" r="1.5" fill="#FFF275"/>
      <circle cx="4" cy="-12" r="1.5" fill="#FFF275"/>
    </g>
    <!-- Live Floating Badge -->
    <rect x="-35" y="-36" width="70" height="18" rx="5" fill="#FF5C1A"/>
    <text x="0" y="-23" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">14 MINS AWAY</text>
  </g>

  <!-- CUSTOMER DESTINATION PIN (310, 240) -->
  <g transform="translate(310, 240)">
    <circle cx="0" cy="0" r="15" fill="#F2A93B" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-6 2 L0 -4 L6 2 V7 H2 V3 H-2 V7 H-6 V2 Z" fill="#141312"/>
    <!-- Label -->
    <rect x="-38" y="-34" width="76" height="20" rx="6" fill="#1E1B18" stroke="#3A342E" stroke-width="1"/>
    <text x="0" y="-20" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#F2A93B" text-anchor="middle">Home (You)</text>
  </g>
</svg>
