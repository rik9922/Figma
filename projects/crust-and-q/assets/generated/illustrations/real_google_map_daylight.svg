<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" fill="none">
  <defs>
    <!-- Realistic 3D Soft Shadow for Floating Map Elements -->
    <filter id="mapHudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="vehicleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#D93B18"/>
    </linearGradient>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Google Maps Daylight Base Ground (#F4F3F0) -->
  <rect width="393" height="852" fill="#F4F3F0"/>

  <!-- City Blocks & Building Footprints (Crisp White with 3D Bevels) -->
  <g fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2">
    <!-- Block NW -->
    <rect x="15" y="75" width="85" height="110" rx="6"/>
    <!-- Block N (Downtown Center) -->
    <rect x="115" y="75" width="135" height="75" rx="6"/>
    <!-- Block NE -->
    <rect x="265" y="75" width="115" height="95" rx="6"/>

    <!-- Block Mid-West -->
    <rect x="15" y="200" width="85" height="120" rx="6"/>
    <!-- Block Rosalind / Eola West -->
    <rect x="115" y="165" width="40" height="155" rx="6"/>

    <!-- Block East of Lake Eola -->
    <rect x="330" y="185" width="50" height="135" rx="6"/>
    <rect x="330" y="335" width="50" height="110" rx="6"/>

    <!-- Block South of Lake Eola -->
    <rect x="15" y="335" width="85" height="110" rx="6"/>
    <rect x="115" y="335" width="95" height="110" rx="6"/>
    <rect x="225" y="335" width="90" height="110" rx="6"/>
  </g>

  <!-- Lake Eola Park (Green Belt Surrounding Lake) -->
  <path d="M165 190 C220 170 310 180 325 240 C340 300 280 325 210 328 C160 330 145 280 150 240 Z" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  
  <!-- Lake Eola Water Body -->
  <path d="M175 205 C220 190 295 198 310 245 C320 290 270 310 215 312 C175 314 162 275 166 242 Z" fill="url(#lakeWater)" stroke="#60A5FA" stroke-width="1.5"/>

  <!-- Linton E. Allen Memorial Fountain (Center of Lake Eola) -->
  <circle cx="238" cy="256" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="238" cy="256" r="3" fill="#60A5FA"/>
  <text x="238" y="278" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">LAKE EOLA PARK</text>

  <!-- Google Maps Road Network -->
  <!-- Arterial Under-Stroke (Grey Border) -->
  <g stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- E Robinson St (Top Horizontal) -->
    <line x1="0" y1="65" x2="393" y2="65"/>
    <!-- E Central Blvd (Main Center Horizontal) -->
    <line x1="0" y1="190" x2="393" y2="190"/>
    <!-- E Washington St (Middle Horizontal) -->
    <line x1="0" y1="325" x2="393" y2="325"/>

    <!-- S Orange Ave (West Vertical) -->
    <line x1="105" y1="0" x2="105" y2="520"/>
    <!-- Rosalind Ave (Lake West Vertical) -->
    <line x1="160" y1="0" x2="160" y2="520"/>
    <!-- Summerlin Ave (Lake East Vertical) -->
    <line x1="325" y1="0" x2="325" y2="520"/>
  </g>

  <!-- Road Surface Layer (Crisp White Streets) -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="65" x2="393" y2="65"/>
    <line x1="0" y1="190" x2="393" y2="190"/>
    <line x1="0" y1="325" x2="393" y2="325"/>
    <line x1="105" y1="0" x2="105" y2="520"/>
    <line x1="160" y1="0" x2="160" y2="520"/>
    <line x1="325" y1="0" x2="325" y2="520"/>
  </g>

  <!-- E Central Blvd Arterial Highway Highlight (Warm Gold #FDE68A) -->
  <line x1="0" y1="190" x2="393" y2="190" stroke="#FDE68A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="105" y1="0" x2="105" y2="520" stroke="#FDE68A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Street Names (Authentic Google Maps Font & Hierarchy) -->
  <text x="18" y="61" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="0.5">E ROBINSON ST</text>
  <text x="18" y="186" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#475569" letter-spacing="0.5">E CENTRAL BLVD</text>
  <text x="18" y="321" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="0.5">E WASHINGTON ST</text>

  <text x="100" y="440" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#475569" letter-spacing="0.5" transform="rotate(-90 100 440)">S ORANGE AVE</text>
  <text x="155" y="440" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#475569" letter-spacing="0.5" transform="rotate(-90 155 440)">ROSALIND AVE</text>
  <text x="320" y="440" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#475569" letter-spacing="0.5" transform="rotate(-90 320 440)">SUMMERLIN AVE</text>

  <!-- LIVE REAL-TIME NAVIGATION ROUTE (From 120 S Orange Ave to 322 E Central Blvd) -->
  <!-- Blue Route Shadow Outer Casing -->
  <path d="M105 460 L105 190 L325 190" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- Primary High-Contrast Polyline (Google Navigation Blue -> Flame Ember) -->
  <path d="M105 460 L105 190 L325 190" stroke="url(#routeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)"/>
  <!-- Inner White Motion Pulse Dash -->
  <path d="M105 460 L105 190 L325 190" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RESTAURANT PIN: Crust & Q Kitchen (120 S Orange Ave: 105, 460) -->
  <g transform="translate(105, 460)" filter="url(#mapHudShadow)">
    <circle cx="0" cy="0" r="17" fill="#D93B18" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-6 4 L0 -6 L6 4 Z" fill="#FFFFFF"/>
    <!-- Label Card -->
    <rect x="-65" y="20" width="130" height="24" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#D93B18" text-anchor="middle">Crust &amp; Q Flagship Pass</text>
  </g>

  <!-- 3D REALISTIC VEHICLE MARKER: Marcus's Silver RAV4 (At Orange & Central: 105, 260) -->
  <g transform="translate(105, 260)" filter="url(#vehicleShadow)">
    <!-- Radar Pulse Waves -->
    <circle cx="0" cy="0" r="34" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="24" fill="#3B82F6" fill-opacity="0.15"/>

    <!-- 3D Vehicle Render (Heading North) -->
    <rect x="-10" y="-19" width="20" height="38" rx="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-8" y="-17" width="16" height="34" rx="4" fill="#94A3B8"/>
    <!-- Roof & Windshield -->
    <rect x="-6" y="-12" width="12" height="10" rx="2" fill="#0F172A"/>
    <rect x="-6" y="2" width="12" height="11" rx="2" fill="#0F172A"/>
    <!-- Headlights -->
    <circle cx="-5" cy="-17" r="2" fill="#FEF08A"/>
    <circle cx="5" cy="-17" r="2" fill="#FEF08A"/>

    <!-- Floating Speed / Heading Pill -->
    <g transform="translate(0, -32)" filter="url(#mapHudShadow)">
      <rect x="-38" y="-10" width="76" height="20" rx="6" fill="#1D4ED8"/>
      <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">MARCUS • 28 MPH</text>
    </g>
  </g>

  <!-- CUSTOMER DESTINATION PIN: The Waverly on Lake Eola (325, 190) -->
  <g transform="translate(325, 190)" filter="url(#mapHudShadow)">
    <circle cx="0" cy="0" r="17" fill="#D97706" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-6 2 L0 -4 L6 2 V6 H-6 Z" fill="#FFFFFF"/>
    <!-- Label Card -->
    <rect x="-70" y="-36" width="140" height="24" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="-20" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#1E293B" text-anchor="middle">Sarah J. • Apt 4B (You)</text>
  </g>

  <!-- Authentic Google Maps UI Controls (Right Side Floating) -->
  <g transform="translate(345, 110)" filter="url(#mapHudShadow)">
    <!-- Compass Button -->
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="18,7 23,25 18,21 13,25" fill="#EF4444"/>
    <polygon points="18,29 23,25 18,21 13,25" fill="#94A3B8"/>

    <!-- Layers Button -->
    <circle cx="18" cy="62" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M12 58 L18 55 L24 58 L18 61 Z" fill="#3B82F6"/>
    <path d="M12 63 L18 66 L24 63" stroke="#3B82F6" stroke-width="1.5" fill="none"/>

    <!-- GPS Recenter Target Button -->
    <circle cx="18" cy="106" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="18" cy="106" r="6" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <line x1="18" y1="96" x2="18" y2="100" stroke="#3B82F6" stroke-width="2"/>
    <line x1="18" y1="112" x2="18" y2="116" stroke="#3B82F6" stroke-width="2"/>
    <line x1="8" y1="106" x2="12" y2="106" stroke="#3B82F6" stroke-width="2"/>
    <line x1="24" y1="106" x2="28" y2="106" stroke="#3B82F6" stroke-width="2"/>
  </g>
</svg>

